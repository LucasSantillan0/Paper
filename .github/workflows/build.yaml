name: Build

on: push

permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 
        with:
          role-to-assume: arn:aws:iam::982498569241:role/GithubActionAccess
          aws-region: sa-east-1
        

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: paper-server
          IMAGE_TAG: mc
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
      
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 
        with:
          role-to-assume: arn:aws:iam::982498569241:role/GithubActionAccess
          aws-region: sa-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: paper-server-0e55
          image: ${{ steps.login-ecr.outputs.registry }}/paper-server:mc
          execution-role-arn: arn:aws:iam::982498569241:role/service-role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::982498569241:role/service-role/ecsInfrastructureRoleForExpressServices
      