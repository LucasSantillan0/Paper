name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: test
        run: |
          echo "test" 
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
  build2:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: |
          echo "test" 